name: Jira validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
      - reopened

jobs:
  jira:
    name: Jira validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Require bot token
        run: |
          if [ -z "${{ steps.bot-token.outputs.token }}" ]; then
            echo "::error::GitHub App bot token is empty. Check repository secrets BOT_APP_ID and BOT_APP_PRIVATE_KEY, and confirm the GitHub App is installed on this repository with access to pull requests and issues."
            exit 1
          fi

      - name: Validate PR title against Jira
        uses: kubevirt-ui/kubevirt-validation@v1
        with:
          base-branch: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          repo-owner: ${{ github.event.pull_request.base.repo.owner.login }}
          repo-name: ${{ github.event.pull_request.base.repo.name }}
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}