name: Jira validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
      - reopened

jobs:
  jira:
    name: Jira validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate bot token
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Validate PR title against Jira
        uses: kubevirt-ui/kubevirt-validation@f9429931c4e04aad456c76a070325409a0b8af2b
        with:
          base-branch: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          repo-owner: ${{ github.repository_owner }}
          repo-name: ${{ github.event.repository.name }}
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}